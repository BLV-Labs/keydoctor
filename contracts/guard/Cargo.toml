[package]
name = "kd-guard"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Key Doctor Guard: a Sputnik DAO member that self-approves transfers within limits"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
near-workspaces = "0.24.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
