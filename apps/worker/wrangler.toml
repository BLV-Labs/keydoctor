# Key Doctor Worker. Secrets are not in this file: set them with `wrangler secret put <NAME>`
# (RUN_CHECK_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, KEEPER_PRIVATE_KEY, KEEPER_ALERT_CHAT_ID). Local dev reads .dev.vars.
name = "key-doctor"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "key-doctor"
# Replace with the id printed by `wrangler d1 create key-doctor`.
database_id = "a7ab0080-7623-4914-bab6-979e63ff8328"
migrations_dir = "migrations"

# Proposal watch every 15 minutes, daily key diff at 02:00 UTC, keeper and yield push every 15 minutes on their
# own offsets (src/index.ts PROPOSAL_CRON, DAILY_CRON, KEEPER_CRON, YIELD_CRON). The free plan allows 5 triggers.
[triggers]
crons = ["*/15 * * * *", "0 2 * * *", "7,22,37,52 * * * *", "11,26,41,56 * * * *"]

[vars]
NEW_KEY_WINDOW_HOURS = "48"
MAX_DAOS_PER_RUN = "5"
PENDING_SUB_TTL_MINUTES = "30"
DASHBOARD_URL = "https://key-doctor-dashboard.pages.dev"
DASHBOARD_ORIGIN = "https://key-doctor-dashboard.pages.dev"
PROPOSAL_UI_URL_TEMPLATE = ""
ALERT_LANG = "both"
RPC_URL_TESTNET = "https://rpc.testnet.fastnear.com,https://rpc.testnet.near.org"
RPC_URL_MAINNET = "https://rpc.mainnet.fastnear.com,https://rpc.mainnet.near.org"
# Keeper (ADR 0005, testnet only). Off until KEEPER_ACCOUNT_ID and the KEEPER_PRIVATE_KEY secret are set: README.md here.
KEEPER_ACCOUNT_ID = "keydoctor-keeper.testnet"
KEEPER_FACTORY_ID = "keydoctor-guards-v2.testnet"
KEEPER_MIN_BALANCE = "1"
KEEPER_MAX_BALANCE = "5"
KEEPER_MAX_GUARDS_PER_RUN = "3"
KEEPER_MAX_STEPS_PER_RUN = "3"
# Yield push (YD3): DAOs read per cycle; watched DAOs take turns. Above 1 only on the paid plan.
MAX_YIELD_DAOS_PER_RUN = "1"
