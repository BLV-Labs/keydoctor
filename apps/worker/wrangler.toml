# Key Doctor Worker. Secrets are not in this file: set them with `wrangler secret put <NAME>`
# (MCP_TOKEN, RUN_CHECK_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET). Local dev reads .dev.vars.
name = "key-doctor"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "key-doctor"
# Replace with the id printed by `wrangler d1 create key-doctor`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Proposal watch every 15 minutes, daily key diff at 02:00 UTC (src/index.ts PROPOSAL_CRON, DAILY_CRON).
[triggers]
crons = ["*/15 * * * *", "0 2 * * *"]

[vars]
NEW_KEY_WINDOW_HOURS = "48"
MAX_DAOS_PER_RUN = "5"
PENDING_SUB_TTL_MINUTES = "30"
DASHBOARD_URL = ""
DASHBOARD_ORIGIN = ""
PROPOSAL_UI_URL_TEMPLATE = ""
ALERT_LANG = "both"
RPC_URL_TESTNET = "https://rpc.testnet.near.org"
RPC_URL_MAINNET = "https://rpc.mainnet.near.org"
