<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img"><title>Agent Guard request flow</title><desc>Agent asks via MCP, Guard checks and always creates a Transfer proposal; Auto path self-approves and pays, Pending path waits for the council.</desc>
<style>
  svg { background: #ffffff; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; fill: #1f2328; }
  .ts { font-size: 12px; fill: #57606a; }
  .arr { stroke: #57606a; stroke-width: 1.5; fill: none; }
  .mk { stroke: #57606a; }
  .c-purple, .c-purple rect { fill: #ede9fe; stroke: #7c3aed; }
  .c-teal, .c-teal rect { fill: #ccfbf1; stroke: #0d9488; }
  .c-gray, .c-gray rect { fill: #f3f4f6; stroke: #6b7280; }
  .c-coral, .c-coral rect { fill: #ffe4e1; stroke: #e5533d; }
  @media (prefers-color-scheme: dark) {
    svg { background: #0d1117; }
    .th { fill: #e6edf3; } .ts { fill: #9da7b3; }
    .arr, .mk { stroke: #9da7b3; }
    .c-purple, .c-purple rect { fill: #2e1f5e; stroke: #a78bfa; }
    .c-teal, .c-teal rect { fill: #0f3b37; stroke: #2dd4bf; }
    .c-gray, .c-gray rect { fill: #21262d; stroke: #9da7b3; }
    .c-coral, .c-coral rect { fill: #4a1d17; stroke: #f87171; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" class="mk" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray">
<rect x="160" y="40" width="360" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Agent: "pay 3 NEAR to vendor"</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">MCP signs request_transfer, FC key</text></g>
<line x1="340" y1="96" x2="340" y2="124" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="160" y="126" width="360" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="144" text-anchor="middle" dominant-baseline="central">Guard hard checks</text>
<text class="ts" x="340" y="164" text-anchor="middle" dominant-baseline="central">Paused, agent, pending, balance: else fail</text></g>
<line x1="340" y1="182" x2="340" y2="210" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="160" y="212" width="360" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="230" text-anchor="middle" dominant-baseline="central">Guard always adds Transfer proposal</text>
<text class="ts" x="340" y="250" text-anchor="middle" dominant-baseline="central">Bond attached, [KD-GUARD] description</text></g>
<path d="M340 268 L340 288 L190 288 L190 308" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M340 268 L340 288 L490 288 L490 308" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="50" y="310" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="190" y="328" text-anchor="middle" dominant-baseline="central">Auto: Guard votes approve</text>
<text class="ts" x="190" y="348" text-anchor="middle" dominant-baseline="central">Whitelisted, per tx, daily ok</text></g>
<g class="node c-coral">
<rect x="350" y="310" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="490" y="328" text-anchor="middle" dominant-baseline="central">Pending: no Guard vote</text>
<text class="ts" x="490" y="348" text-anchor="middle" dominant-baseline="central">Reasons, e.g. OVER_PER_TX</text></g>
<line x1="190" y1="366" x2="190" y2="394" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="366" x2="490" y2="394" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="50" y="396" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="190" y="414" text-anchor="middle" dominant-baseline="central">DAO pays receiver now</text>
<text class="ts" x="190" y="434" text-anchor="middle" dominant-baseline="central">MCP returns auto_approved</text></g>
<g class="node c-coral">
<rect x="350" y="396" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="490" y="414" text-anchor="middle" dominant-baseline="central">Council approves or rejects</text>
<text class="ts" x="490" y="434" text-anchor="middle" dominant-baseline="central">MCP returns pending, sync later</text></g>
</svg>
