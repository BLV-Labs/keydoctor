<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Key Doctor · Choose a wallet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;family=Fira+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
.kd{--kd-page:#F6F7F9;--kd-surface:#FFFFFF;--kd-surface-muted:#F9FAFB;--kd-border:#E4E7EC;--kd-border-strong:#D0D5DD;--kd-border-input:#667085;--kd-text:#101828;--kd-text-2:#344054;--kd-text-muted:#475467;--kd-primary:#1E3A5F;--kd-primary-hover:#0F2742;--kd-on-primary:#FFFFFF;--kd-primary-tint:#E8EEF5;--kd-focus:#2E6BB8;--kd-high:#B42318;--kd-high-bg:#FEF3F2;--kd-high-border:#FECDCA;--kd-high-text:#7A271A;--kd-cleanup:#93370D;--kd-cleanup-bg:#FFFAEB;--kd-cleanup-border:#FEDF89;--kd-ok:#067647;--kd-ok-bg:#ECFDF3;--kd-ok-border:#ABEFC6;--kd-note-bg:#F2F4F7;--kd-info-border:#B9CBE0;--kd-high-edge:#F04438;--kd-cleanup-edge:#DC6803;--kd-backdrop:rgba(16, 24, 40, 0.6);--kd-shadow:0 20px 48px rgba(16, 24, 40, 0.25);color-scheme:light}
.kd[data-theme="dark"]{--kd-page:#0B1017;--kd-surface:#121821;--kd-surface-muted:#161D27;--kd-border:#232C38;--kd-border-strong:#3A4656;--kd-border-input:#6B7A8F;--kd-text:#E6EDF5;--kd-text-2:#C3CDD9;--kd-text-muted:#9AA7B6;--kd-primary:#8DB8EC;--kd-primary-hover:#B3D0F3;--kd-on-primary:#0B1017;--kd-primary-tint:#1B2A3D;--kd-focus:#6EA8FE;--kd-high:#F97066;--kd-high-bg:#2A1414;--kd-high-border:#5C2420;--kd-high-text:#FDA29B;--kd-cleanup:#FDB022;--kd-cleanup-bg:#2A1F0B;--kd-cleanup-border:#5C4210;--kd-ok:#47CD89;--kd-ok-bg:#0E2A1D;--kd-ok-border:#1F5A3D;--kd-note-bg:#1C2430;--kd-info-border:#2D4A6F;--kd-high-edge:#F97066;--kd-cleanup-edge:#FDB022;--kd-backdrop:rgba(0, 0, 0, 0.7);--kd-shadow:0 20px 48px rgba(0, 0, 0, 0.6);color-scheme:dark}
body{margin:0;background:#0B1017}
a{color:var(--kd-primary);cursor:pointer;transition:color .2s,background-color .2s}a:hover{color:var(--kd-primary-hover)}button{cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--kd-focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</helmet>
<div class="kd" data-theme="{{theme}}" style="min-height: 100vh; background: var(--kd-backdrop); font-family: 'Fira Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.5; color: var(--kd-text); display: flex; align-items: center; justify-content: center; padding: 48px 16px; box-sizing: border-box;">
  <div role="dialog" aria-modal="true" aria-labelledby="wallet-h" style="width: 100%; max-width: 480px; background: var(--kd-surface); border-radius: 16px; box-shadow: var(--kd-shadow); display: flex; flex-direction: column; overflow: hidden;">
    <div style="padding: 24px 24px 16px; display: flex; gap: 16px; align-items: flex-start; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
        <h2 id="wallet-h" style="margin: 0; font-size: 18px; font-weight: 600;">Choose a wallet</h2>
        <p style="margin: 0; color: var(--kd-text-muted);">The wallet opens its own window and shows every change before you approve it.</p>
      </div>
      <a href="{{closeHref}}" aria-label="Close" style="flex: none; width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--kd-text-muted);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>
    <div style="margin: 0 24px 24px; padding: 16px; border: 1px solid var(--kd-border); border-radius: 10px; display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{wallets}}" as="w" hint-placeholder-count="3">
        <a href="{{closeHref}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; padding: 0 16px; border: 1px solid var(--kd-border-strong); border-radius: 8px; background: var(--kd-surface); color: var(--kd-text-2); font-weight: 500; text-decoration: none;">
          <span aria-hidden="true" style="flex: none; width: 24px; height: 24px; border-radius: 6px; background: #FFFFFF; border: 1px solid #D0D5DD; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #344054;">{{w.mark}}</span>
          {{w.label}}
        </a>
      </sc-for>
      <p style="margin: 0; font-size: 13px; color: var(--kd-text-muted);">The logo in each button comes from the wallet's own SDK at runtime; it sits on a small light plate so dark logos stay readable in the dark theme.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"from":{"editor":"enum","options":["cleanup","account"],"default":"cleanup"},"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      closeHref: (this.props.from ?? 'cleanup') === 'account' ? 'Account.dc.html' : 'Cleanup.dc.html',
      wallets: [
        { label: 'Meteor Wallet', mark: 'M' },
        { label: 'Here Wallet', mark: 'H' },
        { label: 'HOT Wallet', mark: 'HOT' }
      ]
    };
  }
}
</script>
</body>
</html>
