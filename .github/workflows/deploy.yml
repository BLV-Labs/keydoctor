# Push to main: test, then publish the dashboard to Cloudflare Pages and the Worker (with D1 migrations).
# Repo secrets: CLOUDFLARE_API_TOKEN (Workers, D1, Pages edit), CLOUDFLARE_ACCOUNT_ID.
# Repo variables: KD_WORKER_URL (https origin of the Worker), KD_PAGES_PROJECT (optional, default key-doctor-dashboard).
# Worker runtime secrets (MCP_TOKEN, TELEGRAM_BOT_TOKEN, ...) stay in Cloudflare; this workflow never touches them.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KD_WORKER_URL: ${{ vars.KD_WORKER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build dashboard
        run: pnpm --filter dashboard build
      - name: Publish dashboard to Pages
        run: pnpm --filter worker exec wrangler pages deploy ../dashboard/dist --project-name "${{ vars.KD_PAGES_PROJECT || 'key-doctor-dashboard' }}" --branch main
      - name: Apply D1 migrations
        run: pnpm --filter worker run db:migrate:remote
      - name: Deploy Worker
        run: pnpm --filter worker run deploy
